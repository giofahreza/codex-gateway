name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: io-gateway-deploy-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  REMOTE_REPO: DEPLOY_REMOTE_STAGE_DIR/io-gateway
  LEGACY_REMOTE_REPO: DEPLOY_REMOTE_STAGE_DIR/codex-gateway
  REMOTE_STAGE_DIR: ${{ secrets.DEPLOY_REMOTE_STAGE_DIR }}
  LIVE_BINARY: /opt/gpt-gateway/gpt-gateway
  SERVICE_NAME: gpt-gateway.service
  HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
  READY_URL: ${{ secrets.DEPLOY_READY_URL }}

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check dashboard JavaScript syntax
        run: |
          set -euo pipefail
          awk '/<script>/{flag=1;next} /<\/script>/{flag=0} flag' src/main.rs > /tmp/io-gateway-dashboard.js
          node --check /tmp/io-gateway-dashboard.js

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Record checksum
        run: sha256sum target/release/io-gateway > target/release/io-gateway.sha256

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: io-gateway-linux-x86_64
          path: |
            target/release/io-gateway
            target/release/io-gateway.sha256
          if-no-files-found: error

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: io-gateway-linux-x86_64
          path: ./release

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "DEPLOY_SSH_KEY secret is required for deployment." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          set -euo pipefail
          chmod +x ./release/io-gateway
          SHORT_SHA="${GITHUB_SHA::12}"
          STAGED_BINARY="${REMOTE_STAGE_DIR}/gpt-gateway.${SHORT_SHA}"
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ./release/io-gateway \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${STAGED_BINARY}"
          echo "STAGED_BINARY=${STAGED_BINARY}" >> "${GITHUB_ENV}"

      - name: Install and restart service
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GITHUB_SHA='${GITHUB_SHA}' REMOTE_REPO='${REMOTE_REPO}' LEGACY_REMOTE_REPO='${LEGACY_REMOTE_REPO}' STAGED_BINARY='${STAGED_BINARY}' LIVE_BINARY='${LIVE_BINARY}' SERVICE_NAME='${SERVICE_NAME}' HEALTH_URL='${HEALTH_URL}' READY_URL='${READY_URL}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "${REMOTE_REPO}/.git" ] && [ -d "${LEGACY_REMOTE_REPO}/.git" ]; then
            mv "${LEGACY_REMOTE_REPO}" "${REMOTE_REPO}"
          fi

          cd "${REMOTE_REPO}"
          git remote set-url origin git@github.com:giofahreza/io-gateway.git
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --detach "${GITHUB_SHA}^{commit}"
          CURRENT_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Remote checkout ended at ${CURRENT_SHA}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi

          test -x "${STAGED_BINARY}"
          sha256sum "${STAGED_BINARY}"

          BACKUP="${LIVE_BINARY}.bak.$(date +%Y%m%d%H%M%S)"
          sudo cp "${LIVE_BINARY}" "${BACKUP}"
          sudo install -o root -g root -m 755 "${STAGED_BINARY}" "${LIVE_BINARY}"
          sudo systemctl restart "${SERVICE_NAME}"
          systemctl is-active "${SERVICE_NAME}"

          for attempt in $(seq 1 30); do
            if curl -fsS "${HEALTH_URL}"; then
              echo
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Health check failed after restart" >&2
              exit 1
            fi
            sleep 1
          done

          curl -fsS "${READY_URL}"
          echo
          sha256sum "${LIVE_BINARY}"
          REMOTE
